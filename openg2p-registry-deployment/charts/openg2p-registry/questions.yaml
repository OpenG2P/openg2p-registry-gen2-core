questions:
- variable: global.g2pBridgeHostname
  description: Hostname under which all Bridge services will be accessed
  type: string
  label: G2P Bridge Hostname
  group: General

- variable: g2pBridgeApi.enabled
  description: Install G2P Bridge API
  type: boolean
  label: G2P Bridge API
  group: General

- variable: g2pBridgeCeleryBeatProducers.enabled
  description: Install Celery Beat Producers
  type: boolean
  label: Celery Beat Producers
  group: General

- variable: g2pBridgeCeleryWorkers.enabled
  description: Install Celery Workers
  type: boolean
  label: Celery Workers
  group: General

- variable: benePortalApi.enabled
  description: Install Beneficiary Portal API
  type: boolean
  label: Beneficiary Portal API
  group: General

# Keycloak
- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  group: Keycloak

- variable: global.g2pBridgeAuthClientId
  description: OIDC Client ID for G2P Bridge
  type: string
  label: OIDC Client ID
  group: Keycloak

- variable: global.g2pBridgeAuthClientSecret
  description: OIDC Client Secret for G2P Bridge
  type: string
  label: OIDC Client Secret
  group: Keycloak

# SPAR
- variable: global.g2pBridgeMapperBaseUrl
  description: Base URL to reach SPAR Mapper
  type: string
  label: SPAR Mapper API Base URL
  group: SPAR

# Example bank
- variable: global.g2pBridgeExampleBankBaseUrl
  description: Base URL for Example Bank
  type: string
  label: Bank APIs Base URL
  group: Example Bank

