global:
  registryHostname: registry.dev.openg2p.org

  # Database
  postgresqlHost: openg2p-commons-postgresql
  registryDB: '{{ .Release.Name }}_db'
  registryDBPort: 5432
  registryDBUser: '{{ .Release.Name }}_db_user'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}_db_user'

  # Redis
  redisInstallationName: '{{ .Release.Name }}-redis-master'
  
  # Minio
  minioInstallationName: '{{ .Release.Name }}-minio'
    
  # Security & Authentication
  keymanagerInstallationName: openg2p-commons-keymanager
  keycloakBaseUrl: https://keycloak.openg2p.org
  keycloakIssuerUrl: '{{ .Values.global.keycloakBaseUrl }}/realms/master'
  
  registryKeymanagerAuthEnabled: false
  registryKeymanagerAppId: REGISTRY
  registryAuthClientId: 'openg2p-registry-{{ .Release.Namespace }}'
  registryAuthClientSecret: ''

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: openg2p-commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.registryDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

partnerApi:
  enabled: true
  nameOverride: partner-api
  hostname: '{{ tpl .Values.global.registryHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-registry-partner-api
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  
  openapiRootPath: /api/partner
  
  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      gateway: "internal"
      destination: '{{ template "common.names.fullname" . }}'
      destinationPort: 80
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
  
  envVars:
    REGISTRY_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_PARTNER_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_PARTNER_API_PORT: '{{ .Values.containerPort }}'
    REGISTRY_PARTNER_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    
    REGISTRY_PARTNER_API_JWT_VALIDATE_KEYMANAGER_APP_ID: '{{ .Values.global.registryKeymanagerAppId }}'
    REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: "http://{{ .Values.global.keymanagerInstallationName }}/v1/keymanager"
    REGISTRY_PARTNER_API_OAUTH_ENABLED: '{{ .Values.global.registryKeymanagerAuthEnabled }}'
    REGISTRY_PARTNER_API_OAUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_OAUTH_CLIENT_ID: '{{ tpl .Values.global.registryAuthClientId $ }}'
    REGISTRY_PARTNER_API_OAUTH_CLIENT_SECRET: '{{ .Values.global.registryAuthClientSecret }}'

  envVarsFrom:
    REGISTRY_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  
  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_PARTNER_API_DB_USERNAME} -h ${REGISTRY_PARTNER_API_DB_HOSTNAME} -p ${REGISTRY_PARTNER_API_DB_PORT:-5432} -d ${REGISTRY_PARTNER_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  postgresqlInstallationName: '{{ .Release.Name }}-postgresql'
  containerPort: 8000

